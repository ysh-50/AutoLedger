name: Build AutoLedger APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Build Debug APK
        run: |
          if [ -f "AutoLedger/build.gradle.kts" ]; then cd AutoLedger; fi
          gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLedger-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 30
